# Free Supabase projects pause after 7 days without use. This pings the
# project once a day so the app stays awake even if you're both away.
# (GitHub turns off scheduled workflows after 60 days with no repo activity;
# it emails a one-click re-enable link when that happens.)
name: Keep Supabase awake

on:
  schedule:
    - cron: '23 14 * * *'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Ping Supabase
        run: |
          url=$(grep -oE "supabaseUrl: '[^']+'" src/lib/config.ts | head -1 | cut -d"'" -f2)
          key=$(grep -oE "supabasePublishableKey: '[^']+'" src/lib/config.ts | head -1 | cut -d"'" -f2)
          code=$(curl -s -o /dev/null -w '%{http_code}' "$url/auth/v1/health" -H "apikey: $key")
          echo "Supabase answered HTTP $code"
          test "$code" = 200
